name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package release
        run: bun run build:release

      - name: Upload Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite web bundle
        run: bun run build

      - name: Build Electron main and preload
        run: bun scripts/build-electron.ts

      - name: Compile Bun Sidecar
        run: |
          mkdir -p sidecar release
          bun build --compile server/main.ts --outfile sidecar/blackbook-server

      - name: Package macOS DMG
        run: bunx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Generate Checksums
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-mac-${{ matrix.arch }}.txt

      - name: Upload macOS Release Binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/SHA256SUMS-mac-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
